<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vibe Board</title>
  <link rel="stylesheet" href="/static/board.css">
</head>
<body>
  <header>
    <div class="bar">
      <nav class="tabs">
        <button data-tab="global">Global</button>
        <button data-tab="project">Project</button>
        <button data-tab="session">Session</button>
      </nav>
      <button id="plus" type="button" title="Add an item">+</button>
    </div>
    <div id="scope" class="scope"></div>
  </header>
  <main id="main">
    <div id="tree"></div>
  </main>
  <section id="inspector" class="inspector" hidden></section>
  <form id="add" class="add" autocomplete="off" hidden>
    <select id="add-origin" title="origin">
      <option value="plan">plan</option>
      <option value="incident">incident</option>
      <option value="insert">insert</option>
    </select>
    <input id="add-title" placeholder="New item, Enter to add, Esc to close">
    <select id="add-project" title="project"></select>
  </form>
  <footer id="footer" hidden>
    <span id="status"></span>
    <button id="undo" type="button" hidden>Undo</button>
  </footer>
  <script src="/static/board.js"></script>
</body>
</html>
